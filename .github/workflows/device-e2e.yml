name: Device truth (iOS + Maestro)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: device-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-device-e2e:
    name: iOS Simulator · critical path + tap crawl
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SANDBOX: "1"
      MAESTRO_CLI_NO_ANALYTICS: "1"
      APP_ID: com.falconlabs.ontheline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Java for Maestro
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        run: npx pod-install ios

      - name: Select and boot an available iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          # Runner Xcode versions change the available device names (SE 3rd gen / 15
          # were hardcoded and no longer exist), so pick whatever iPhone the runner
          # actually has instead of a fixed name. Any booted iPhone gives real touch.
          UDID="$(xcrun simctl list devices available | grep -oE 'iPhone[^(]*\(([0-9A-Fa-f-]{36})\)' | grep -oE '[0-9A-Fa-f-]{36}' | head -1)"
          if [ -z "$UDID" ]; then
            echo 'No available iPhone simulator on this runner:' >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Selected iPhone simulator UDID: $UDID"
          xcrun simctl shutdown all || true
          xcrun simctl boot "$UDID"
          open -a Simulator
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build sandbox app for iOS Simulator
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -workspace ios/OntheLine.xcworkspace \
            -scheme OntheLine \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild.log

      - name: Surface iOS build errors (on failure)
        if: failure()
        run: |
          echo "===== xcodebuild ERROR lines ====="
          grep -nE "error:|error G[0-9]+:| error: |ld: |fatal error:|The following build commands failed|Command .* failed with a nonzero exit code" build/xcodebuild.log 2>/dev/null | tail -120 || echo "(no build/xcodebuild.log found)"
          echo "===== last 200 lines of xcodebuild.log ====="
          tail -200 build/xcodebuild.log 2>/dev/null || echo "(no log)"

      - name: Install and launch sandbox app
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          APP_PATH="$(find build/ios/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch "$UDID" "$APP_ID"

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run blocking device-truth flows
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/maestro artifacts/screenshots artifacts/video
          VIDEO="artifacts/video/ios-sim.mp4"
          xcrun simctl io "$UDID" recordVideo --codec=h264 "$VIDEO" >/tmp/sim-video.log 2>&1 &
          VIDEO_PID=$!
          cleanup() {
            xcrun simctl io "$UDID" screenshot "artifacts/screenshots/ios-sim-final.png" || true
            kill -INT "$VIDEO_PID" 2>/dev/null || true
            wait "$VIDEO_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          maestro --device "$UDID" test \
            --format junit \
            --output "artifacts/maestro/ios-sim.xml" \
            e2e/critical-path.yaml e2e/route-reachability.yaml

      - name: Upload device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-e2e
          path: |
            artifacts/
            build/xcodebuild.log
            ~/.maestro/tests/
          if-no-files-found: warn
          retention-days: 14
