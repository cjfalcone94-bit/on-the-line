appId: com.falconlabs.ontheline
name: Founder device truth — complete critical path
---
- launchApp:
    clearState: true
- assertVisible:
    id: trust-screen
# Visual evidence (builds 21-22 regression): capture the FIRST screen so a human
# can confirm text sits below the notch, not jammed against the status bar.
- takeScreenshot: 01-first-screen-top-spacing
- tapOn:
    id: browse-templates-button
- assertVisible:
    id: catalog-screen
- takeScreenshot: 03-catalog-screen
- tapOn:
    id: template-daily-walk
- assertVisible:
    id: template-detail-screen
- takeScreenshot: 04-detail-screen-and-set-stake-button
- tapOn: "Set stake"
- assertVisible:
    id: commit-screen
# Regression guard (build 21): the stake prompt must be on-screen — it went
# missing under the notch when the top safe-area inset stopped applying.
- assertVisible: "How much are you staking?"
# Visual evidence: the stake screen the founder couldn't proceed past — confirm
# the "How much are you staking?" prompt + dollar amounts are fully on-screen.
- takeScreenshot: 02-stake-screen-money-step
- tapOn:
    id: stake-4000
# Post-selection: the chosen chip's gold FILL and the now-enabled "Choose charity"
# CTA both go through InteractivePressable — verify the fill actually paints.
- takeScreenshot: 02b-stake-selected
- tapOn: "Choose charity"
- takeScreenshot: 05-charity-screen
- tapOn:
    id: charity-direct-relief
# Post-selection: charity gold left-rule + enabled "Review the terms" CTA.
- takeScreenshot: 05b-charity-selected
- tapOn: "Review the terms"
- assertVisible: "No surprises."
- takeScreenshot: 06-disclosure-screen
- tapOn: "Continue to card authorization"
- assertVisible: "Authorize a mock stake."
- takeScreenshot: 07-card-authorize-screen
- tapOn: "Run mock authorization"
- extendedWaitUntil:
    visible: "Mock stake authorized."
    timeout: 10000
- tapOn: "Submit today’s proof"
- assertVisible:
    id: proof-screen
- takeScreenshot: 08-proof-screen
- tapOn:
    id: "use-mock-proof"
- tapOn:
    id: submit-proof
- extendedWaitUntil:
    visible: "Submitted — under review."
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "View status"
    direction: DOWN
- tapOn: "View status"
- assertVisible:
    id: verify-status-screen
- takeScreenshot: 09-verify-status-screen
- extendedWaitUntil:
    visible:
      id: verification-passed
    timeout: 10000
- tapOn: "Settle mock outcome"
- assertVisible:
    id: settle-screen
- takeScreenshot: 10-settle-screen
- extendedWaitUntil:
    visible:
      id: receipt-confirmation
    timeout: 10000
- assertVisible: "Sandbox simulation complete: success. No card was charged and no money moved."
- tapOn: "View Commitment Record"
- assertVisible:
    id: commitment-record-screen
- takeScreenshot: 11-commitment-record-screen
- scrollUntilVisible:
    element:
      text: "Daily outdoor walk, SETTLED · SUCCESS"
    direction: DOWN
    timeout: 10000
- assertVisible: "Daily outdoor walk, SETTLED · SUCCESS"
- takeScreenshot: critical-path-complete
